name: Publish Neo 7 tag

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-neo-7.yml

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release tag only on approved fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e HEAD:files/entware/_ipk/control/postinst
          grep -q 'restart || exit 1' files/entware/_ipk/control/postinst
          grep -q '"$SSD" -K -n "$NAME"' files/entware/etc/init.d/S99magitrickle
          if git ls-remote --exit-code origin refs/tags/7 >/dev/null 2>&1; then
            echo "Tag 7 already exists; refusing to overwrite" >&2
            exit 1
          fi
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com tag -a 7 -m "MagiTrickle Neo 7"
          git push origin refs/tags/7
          gh workflow run build.yml --ref 7
