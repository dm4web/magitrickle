name: Release packages

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      configs: ${{ steps.matrix.outputs.configs }}
      total: ${{ steps.matrix.outputs.total }}
      openwrt: ${{ steps.matrix.outputs.openwrt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
      - name: Verify Neo release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            ''|*[!0-9]*) echo "Neo release tag must be a single non-negative integer" >&2; exit 1 ;;
          esac
      - name: Verify release tag belongs to main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "refs/tags/${RELEASE_TAG}^{commit}" refs/remotes/origin/main; then
            echo "Neo releases must be tagged from main" >&2
            exit 1
          fi
      - id: matrix
        name: Build target matrix
        env:
          BUILD_ENTWARE_GENERIC: ${{ vars.BUILD_ENTWARE_GENERIC }}
          BUILD_OPENWRT: ${{ vars.BUILD_OPENWRT }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          def enabled(name):
              return os.environ.get(name, "").strip().lower() in ("1", "true", "yes")

          # Always include the standard aarch64 feed and Keenetic variants.
          files = sorted(Path("config/entware").glob("*_kn.config"))
          files.append(Path("config/entware/aarch64-3.10.config"))
          if enabled("BUILD_ENTWARE_GENERIC"):
              files += sorted(p for p in Path("config/entware").glob("*.config")
                            if not p.stem.endswith("_kn") and p.stem != "aarch64-3.10")
          if enabled("BUILD_OPENWRT"):
              files += sorted(Path("config/openwrt").glob("*.config"))
          if not files:
              raise SystemExit("No Keenetic Entware configurations found")
          matrix = [
              {"config": str(p), "name": f"{p.parent.name}-{p.stem}",
               "platform": p.parent.name}
              for p in files
          ]
          if len({x["name"] for x in matrix}) != len(matrix):
              raise SystemExit("Duplicate target names")
          print("configs=" + json.dumps(matrix, separators=(",", ":")))
          print("total=" + str(len(matrix)))
          print("openwrt=" + str(sum(x["platform"] == "openwrt" for x in matrix)))
          PY

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Frontend checks and build
        working-directory: src/frontend
        env:
          VITE_PKG_VERSION: ${{ github.ref_name }}
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run test:unit
          npm run build
      - name: Verify static UI
        run: |
          test -s src/frontend/build/index.html
          test -d src/frontend/build/_app
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: src/frontend/build/
          if-no-files-found: error
          retention-days: 7

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.sum
      - name: Go tests
        working-directory: src/backend
        run: |
          go test ./...
          go test -tags "entware entware_kn" ./...

  packages:
    name: ${{ matrix.name }}
    needs: [prepare, frontend, backend]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.configs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: src/frontend/build
      - name: Install Entware packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot upx-ucl
          if ! command -v upx >/dev/null 2>&1; then
            sudo ln -s "$(command -v upx-ucl)" /usr/local/bin/upx
          fi
      - name: Install OpenWrt packaging tools
        if: matrix.platform == 'openwrt'
        run: |
          sudo apt-get install -y openssl meson ninja-build pkg-config libssl-dev zlib1g-dev libzstd-dev
      - name: Build apk-tools 3
        if: matrix.platform == 'openwrt'
        run: |
          git clone --depth 1 --branch v3.0.7 https://github.com/alpinelinux/apk-tools.git "$RUNNER_TEMP/apk-tools"
          meson setup "$RUNNER_TEMP/apk-tools/build" "$RUNNER_TEMP/apk-tools" -Dpython=disabled -Dtests=disabled -Ddocs=disabled
          ninja -C "$RUNNER_TEMP/apk-tools/build"
          sudo ninja -C "$RUNNER_TEMP/apk-tools/build" install
          sudo ldconfig
          apk --version
      - name: Prepare APK signing
        if: matrix.platform == 'openwrt'
        env:
          APK_KEY: ${{ secrets.BUILD_KEY_APK_SEC }}
        run: |
          key="$RUNNER_TEMP/magitrickle-signing.pem"
          if [ -n "$APK_KEY" ]; then
            printf '%s\n' "$APK_KEY" > "$key"
          else
            openssl ecparam -name prime256v1 -genkey -noout -out "$key"
          fi
          chmod 600 "$key"
          openssl ec -in "$key" -pubout -out "$RUNNER_TEMP/magitrickle.pub"
          echo "BUILD_KEY_APK_SEC=$key" >> "$GITHUB_ENV"
      - name: Build packages
        env:
          BUILD_CONFIG: ${{ matrix.config }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cp "$BUILD_CONFIG" .config
          make FRONTEND_PREBUILT=1 TAG="$RELEASE_TAG" package
      - name: Collect packages
        env:
          TARGET_NAME: ${{ matrix.name }}
          PLATFORM: ${{ matrix.platform }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p release-output
          find .build -maxdepth 1 -type f \( -name 'magitrickle_*.ipk' -o -name 'magitrickle_*.apk' \) -exec cp -t release-output -- {} +
          test "$(find release-output -maxdepth 1 -name '*.ipk' | wc -l)" -eq 1
          if [ "$PLATFORM" = "openwrt" ]; then
            test "$(find release-output -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
            cp "$RUNNER_TEMP/magitrickle.pub" "release-output/${TARGET_NAME}.pub"
          fi
          if [ "$PLATFORM" = "entware" ] && [ "${TARGET_NAME#entware-}" != "$TARGET_NAME" ] && [ "${TARGET_NAME%_kn}" != "$TARGET_NAME" ]; then
            pkg="$(find release-output -maxdepth 1 -type f -name '*.ipk' -print -quit)"
            python3 e2e/verify-keenetic-ipk.py --target "${TARGET_NAME#entware-}" --version "$RELEASE_TAG" "$pkg"
          fi
          ls -lh release-output
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: release-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Publish GitHub Release with verified packages
    needs: [prepare, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Verify package counts and checksums
        env:
          EXPECTED_TOTAL: ${{ needs.prepare.outputs.total }}
          EXPECTED_APK: ${{ needs.prepare.outputs.openwrt }}
        run: |
          test "$(find release-assets -maxdepth 1 -name '*.ipk' | wc -l)" -eq "$EXPECTED_TOTAL"
          test "$(find release-assets -maxdepth 1 -name '*.apk' | wc -l)" -eq "$EXPECTED_APK"
          test "$(find release-assets -maxdepth 1 -name '*.pub' | wc -l)" -eq "$EXPECTED_APK"
          cd release-assets
          find . -maxdepth 1 -type f \( -name '*.ipk' -o -name '*.apk' -o -name '*.pub' \) -print0 |
            sort -z | xargs -0 sha256sum > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq "$((EXPECTED_TOTAL + EXPECTED_APK * 2))"
      - name: Publish packages as MagiTrickle Neo release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --repo "$GH_REPO" --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GH_REPO" --verify-tag \
              --title "MagiTrickle Neo $RELEASE_TAG" \
              --notes "MagiTrickle Neo $RELEASE_TAG. Keenetic Entware packages and SHA256SUMS."
          fi

  pages:
    name: Publish public Entware repository
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Generate public Entware feeds
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/build-entware-pages.py \
            --version "$RELEASE_TAG" \
            --source release-assets \
            --output public-site
          for arch in aarch64-3.10 aarch64-3.10_kn mips-3.4_kn mipsel-3.4_kn; do
            test -s "public-site/entware/$arch/Packages.gz"
            gzip -t "public-site/entware/$arch/Packages.gz"
          done
          test -s public-site/latest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public-site
      - name: Deploy public packages to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
