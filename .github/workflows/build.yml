name: Release packages

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      configs: ${{ steps.matrix.outputs.configs }}
      total: ${{ steps.matrix.outputs.total }}
      openwrt: ${{ steps.matrix.outputs.openwrt }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - id: matrix
        name: Build target matrix
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          files = sorted(Path("config").glob("*/*.config"))
          if not files:
              raise SystemExit("No target configurations")
          matrix = [
              {"config": str(p), "name": f"{p.parent.name}-{p.stem}",
               "platform": p.parent.name}
              for p in files
          ]
          if len({x["name"] for x in matrix}) != len(matrix):
              raise SystemExit("Duplicate target names")
          print("configs=" + json.dumps(matrix, separators=(",", ":")))
          print("total=" + str(len(matrix)))
          print("openwrt=" + str(sum(x["platform"] == "openwrt" for x in matrix)))
          PY

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Frontend checks and build
        working-directory: src/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run test:unit
          npm run build
      - name: Verify static UI
        run: |
          test -s src/frontend/build/index.html
          test -d src/frontend/build/_app
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: src/frontend/build/
          if-no-files-found: error
          retention-days: 7

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.sum
      - name: Go tests
        working-directory: src/backend
        run: go test ./...

  packages:
    name: ${{ matrix.name }}
    needs: [prepare, frontend, backend]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.configs) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          fetch-tags: true
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/backend/go.mod
          cache-dependency-path: src/backend/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: src/frontend/build
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot upx-ucl openssl meson ninja-build pkg-config libssl-dev zlib1g-dev libzstd-dev
          if ! command -v upx >/dev/null 2>&1; then
            sudo ln -s "$(command -v upx-ucl)" /usr/local/bin/upx
          fi
      - name: Build apk-tools 3
        if: matrix.platform == 'openwrt'
        run: |
          git clone --depth 1 --branch v3.0.7 https://github.com/alpinelinux/apk-tools.git "$RUNNER_TEMP/apk-tools"
          meson setup "$RUNNER_TEMP/apk-tools/build" "$RUNNER_TEMP/apk-tools" -Dpython=disabled -Dtests=disabled -Ddocs=disabled
          ninja -C "$RUNNER_TEMP/apk-tools/build"
          sudo ninja -C "$RUNNER_TEMP/apk-tools/build" install
          sudo ldconfig
          apk --version
      - name: Prepare APK signing
        if: matrix.platform == 'openwrt'
        env:
          APK_KEY: ${{ secrets.BUILD_KEY_APK_SEC }}
        run: |
          key="$RUNNER_TEMP/magitrickle-signing.pem"
          if [ -n "$APK_KEY" ]; then
            printf '%s\n' "$APK_KEY" > "$key"
          else
            openssl ecparam -name prime256v1 -genkey -noout -out "$key"
          fi
          chmod 600 "$key"
          openssl ec -in "$key" -pubout -out "$RUNNER_TEMP/magitrickle.pub"
          echo "BUILD_KEY_APK_SEC=$key" >> "$GITHUB_ENV"
      - name: Build packages
        env:
          BUILD_CONFIG: ${{ matrix.config }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cp "$BUILD_CONFIG" .config
          make FRONTEND_PREBUILT=1 TAG="$RELEASE_TAG" package
      - name: Collect packages
        env:
          TARGET_NAME: ${{ matrix.name }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p release-output
          find .build -maxdepth 1 -type f \( -name 'magitrickle_*.ipk' -o -name 'magitrickle_*.apk' \) -exec cp -t release-output -- {} +
          test "$(find release-output -maxdepth 1 -name '*.ipk' | wc -l)" -eq 1
          if [ "$PLATFORM" = "openwrt" ]; then
            test "$(find release-output -maxdepth 1 -name '*.apk' | wc -l)" -eq 1
            cp "$RUNNER_TEMP/magitrickle.pub" "release-output/${TARGET_NAME}.pub"
          fi
          ls -lh release-output
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: release-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: Attach packages to GitHub Release
    needs: [prepare, packages]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Verify package counts and checksums
        env:
          EXPECTED_TOTAL: ${{ needs.prepare.outputs.total }}
          EXPECTED_APK: ${{ needs.prepare.outputs.openwrt }}
        run: |
          test "$(find release-assets -maxdepth 1 -name '*.ipk' | wc -l)" -eq "$EXPECTED_TOTAL"
          test "$(find release-assets -maxdepth 1 -name '*.apk' | wc -l)" -eq "$EXPECTED_APK"
          test "$(find release-assets -maxdepth 1 -name '*.pub' | wc -l)" -eq "$EXPECTED_APK"
          cd release-assets
          sha256sum ./*.ipk ./*.apk ./*.pub > SHA256SUMS
      - name: Upload packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" release-assets/* --repo "$GH_REPO" --clobber
